<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GALE MEADOW — a 2021 field</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #182048;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        user-select: none; -webkit-user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #title {
        position: fixed; inset: 0; z-index: 30; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        background: transparent; pointer-events: auto; cursor: pointer;
      }
      #title.hidden { display: none; }
      .t-logo {
        font-size: min(11vw, 118px); font-weight: 900; font-style: italic;
        letter-spacing: 0.02em; line-height: 0.9; text-align: center;
        color: #f0f8e8;
        text-shadow:
          0.045em 0.045em 0 #3fc8a8,
          0.09em 0.09em 0 #1c2450;
        transform: skewX(-6deg);
      }
      .t-sub {
        margin-top: 16px; color: #ffd98a; font-weight: 700;
        letter-spacing: 0.45em; text-indent: 0.45em; font-size: clamp(10px, 1.6vw, 15px);
        text-transform: uppercase;
      }
      .t-start {
        margin-top: 44px; color: #1c2450; font-weight: 900; font-style: italic;
        font-size: clamp(14px, 2.2vw, 22px); letter-spacing: 0.14em;
        padding: 10px 34px; border: 3px solid #1c2450;
        background: #3fc8a8; box-shadow: 6px 6px 0 #1c2450;
        transform: skewX(-8deg); animation: pulse 1.15s steps(2) infinite;
      }
      @keyframes pulse { 50% { background: #f0f8e8; } }
      .t-keys {
        margin-top: 32px; color: #c8d8f0; font-size: 12px; letter-spacing: 0.12em;
        text-align: center; line-height: 1.9; text-transform: uppercase;
      }
      .t-keys b { color: #3fc8a8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="title">
      <div class="t-logo">GALE<br/>MEADOW</div>
      <div class="t-sub">wind &middot; flame &middot; one ruin warden &middot; 2021</div>
      <div class="t-start">PRESS ENTER</div>
      <div class="t-keys">
        <b>WASD</b> move &nbsp; <b>SPACE</b> jump / glide / climb &nbsp; <b>LMB</b> combo<br/>
        <b>1 / 2</b> stance &nbsp; <b>E</b> skill &nbsp; <b>Q</b> burst &nbsp; <b>SHIFT</b> dodge
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
