<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUSTFALL ISLAND — a 2017 battle royale</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #241f3a;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        user-select: none; -webkit-user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #title {
        position: fixed; inset: 0; z-index: 30; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        background: transparent; pointer-events: auto; cursor: pointer;
      }
      #title.hidden { display: none; }
      .t-logo {
        font-size: min(10vw, 110px); font-weight: 900; font-style: italic;
        letter-spacing: 0.02em; line-height: 0.9; text-align: center;
        color: #ffe9c0;
        text-shadow:
          0.045em 0.045em 0 #f2952a,
          0.09em 0.09em 0 #2b2440;
        transform: skewX(-6deg);
      }
      .t-sub {
        margin-top: 16px; color: #a8d8f0; font-weight: 700;
        letter-spacing: 0.45em; text-indent: 0.45em; font-size: clamp(10px, 1.5vw, 15px);
        text-transform: uppercase;
      }
      .t-start {
        margin-top: 44px; color: #2b2440; font-weight: 900; font-style: italic;
        font-size: clamp(14px, 2.2vw, 22px); letter-spacing: 0.14em;
        padding: 10px 34px; border: 3px solid #2b2440;
        background: #f2952a; box-shadow: 6px 6px 0 #2b2440;
        transform: skewX(-8deg); animation: pulse 1.15s steps(2) infinite;
      }
      @keyframes pulse { 50% { background: #ffe9c0; } }
      .t-keys {
        margin-top: 32px; color: #d8cfe8; font-size: 12px; letter-spacing: 0.12em;
        text-align: center; line-height: 1.9; text-transform: uppercase;
      }
      .t-keys b { color: #f2952a; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="title">
      <div class="t-logo">DUSTFALL<br/>ISLAND</div>
      <div class="t-sub">16 drop &middot; one wins &middot; a 2017 battle royale</div>
      <div class="t-start">PRESS ENTER</div>
      <div class="t-keys">
        <b>WASD</b> move &nbsp; <b>ARROWS</b> aim-nudge &nbsp; <b>SPACE / LMB</b> fire &nbsp; <b>RMB</b> aim<br/>
        <b>SHIFT</b> sprint &nbsp; <b>C</b> prone &nbsp; <b>R</b> reload &nbsp; <b>F</b> interact / buggy &nbsp; <b>TAB</b> map
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
