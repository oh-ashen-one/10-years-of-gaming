<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUILD ROYALE — a 2018 drop</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #241838;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        user-select: none; -webkit-user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #title {
        position: fixed; inset: 0; z-index: 30; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        background: transparent; pointer-events: auto; cursor: pointer;
      }
      #title.hidden { display: none; }
      .t-logo {
        font-size: min(11vw, 118px); font-weight: 900; font-style: italic;
        letter-spacing: 0.02em; line-height: 0.9; text-align: center;
        color: #fff3d0;
        text-shadow:
          0.045em 0.045em 0 #ff5fa8,
          0.09em 0.09em 0 #402a58;
        transform: skewX(-6deg);
      }
      .t-sub {
        margin-top: 16px; color: #8fe8d8; font-weight: 700;
        letter-spacing: 0.5em; text-indent: 0.5em; font-size: clamp(10px, 1.6vw, 16px);
        text-transform: uppercase;
      }
      .t-start {
        margin-top: 44px; color: #402a58; font-weight: 900; font-style: italic;
        font-size: clamp(14px, 2.2vw, 22px); letter-spacing: 0.14em;
        padding: 10px 34px; border: 3px solid #402a58;
        background: #ffd23f; box-shadow: 6px 6px 0 #402a58;
        transform: skewX(-8deg); animation: pulse 1.15s steps(2) infinite;
      }
      @keyframes pulse { 50% { background: #fff3d0; } }
      .t-keys {
        margin-top: 32px; color: #e8d0f0; font-size: 12px; letter-spacing: 0.12em;
        text-align: center; line-height: 1.9; text-transform: uppercase;
      }
      .t-keys b { color: #ffd23f; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="title">
      <div class="t-logo">BUILD<br/>ROYALE</div>
      <div class="t-sub">12 drop &middot; harvest &middot; build &middot; win &middot; a 2018 story</div>
      <div class="t-start">PRESS ENTER</div>
      <div class="t-keys">
        <b>WASD</b> move &nbsp; <b>SPACE</b> jump / glider &nbsp; <b>LMB</b> swing / fire &nbsp; <b>RMB</b> aim<br/>
        <b>Q</b> build mode / cycle piece &nbsp; <b>G</b> edit &nbsp; <b>E</b> chests &nbsp; <b>SHIFT</b> sprint &nbsp; <b>TAB</b> map
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
