<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVERPAINT — a 2025 tale</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #14101e;
        font-family: Georgia, "Times New Roman", serif;
        user-select: none; -webkit-user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #title {
        position: fixed; inset: 0; z-index: 30; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        background: transparent; pointer-events: auto; cursor: pointer;
      }
      #title.hidden { display: none; }
      .t-logo {
        font-size: min(10vw, 108px); font-weight: 700; font-style: italic;
        letter-spacing: 0.1em; line-height: 1; text-align: center;
        color: #f7e8c8;
        text-shadow:
          0.03em 0.03em 0 #9a6a2a,
          0.07em 0.07em 0 #14101e;
      }
      .t-num {
        margin-top: 8px; font-size: clamp(16px, 2.4vw, 26px); color: #ffd98a;
        letter-spacing: 0.55em; text-indent: 0.55em; font-style: italic;
      }
      .t-sub {
        margin-top: 14px; color: #c8a8b0; font-weight: 400;
        letter-spacing: 0.5em; text-indent: 0.5em; font-size: clamp(10px, 1.5vw, 15px);
        text-transform: uppercase; font-style: italic;
      }
      .t-start {
        margin-top: 48px; color: #f7e8c8; font-weight: 400; font-style: italic;
        font-size: clamp(14px, 2vw, 20px); letter-spacing: 0.3em;
        padding: 12px 38px; border: 2px solid #9a6a2a;
        background: rgba(20,16,30,0.6);
        animation: pulse 1.6s steps(2) infinite;
      }
      @keyframes pulse { 50% { background: rgba(247,232,200,0.25); } }
      .t-keys {
        margin-top: 36px; color: #8a7a88; font-size: 12px; letter-spacing: 0.14em;
        text-align: center; line-height: 2.0; text-transform: uppercase;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .t-keys b { color: #f7e8c8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="title">
      <div class="t-logo">OVERPAINT</div>
      <div class="t-num">— 34 —</div>
      <div class="t-sub">a painted expedition beneath the number &middot; 2025</div>
      <div class="t-start">PRESS ENTER</div>
      <div class="t-keys">
        <b>WASD</b> walk &nbsp; <b>1–3</b> strike / aim / ink lance &nbsp; <b>Q</b> overpaint<br/>
        <b>SPACE</b> dodge &amp; jump markers &nbsp; <b>F</b> parry &nbsp; <b>TAB</b> target &nbsp; <b>ENTER</b> confirm / end turn
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
