<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOLLHOUSE — a 2023 dice tale</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #120c14;
        font-family: Georgia, "Times New Roman", serif;
        user-select: none; -webkit-user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #dice { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
      #title {
        position: fixed; inset: 0; z-index: 30; display: flex;
        flex-direction: column; align-items: center; justify-content: center;
        background: transparent; pointer-events: auto; cursor: pointer;
      }
      #title.hidden { display: none; }
      .t-logo {
        font-size: min(11vw, 116px); font-weight: 700; font-style: italic;
        letter-spacing: 0.04em; line-height: 0.95; text-align: center;
        color: #f0d890;
        text-shadow:
          0.04em 0.04em 0 #8a5a2a,
          0.09em 0.09em 0 #120c14;
      }
      .t-sub {
        margin-top: 18px; color: #8ab8d8; font-weight: 400;
        letter-spacing: 0.5em; text-indent: 0.5em; font-size: clamp(10px, 1.5vw, 15px);
        text-transform: uppercase; font-style: italic;
      }
      .t-start {
        margin-top: 46px; color: #f0d890; font-weight: 400; font-style: italic;
        font-size: clamp(14px, 2vw, 20px); letter-spacing: 0.28em;
        padding: 12px 38px; border: 2px solid #8a5a2a;
        background: rgba(18,12,20,0.65);
        animation: pulse 1.6s steps(2) infinite;
      }
      @keyframes pulse { 50% { background: rgba(240,216,144,0.22); } }
      .t-keys {
        margin-top: 34px; color: #9a8a78; font-size: 12px; letter-spacing: 0.14em;
        text-align: center; line-height: 2.0; text-transform: uppercase;
      }
      .t-keys b { color: #f0d890; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="dice"></canvas>
    <div id="hud"></div>
    <div id="title">
      <div class="t-logo">TOLLHOUSE</div>
      <div class="t-sub">one bridge &middot; one tollkeeper &middot; the d20 decides &middot; 2023</div>
      <div class="t-start">PRESS ENTER</div>
      <div class="t-keys">
        dialogue: <b>1-5</b> choose &nbsp; combat: <b>WASD</b> move &nbsp; <b>TAB</b> target &nbsp; <b>1-4</b> abilities<br/>
        <b>SPACE</b> confirm &nbsp; <b>ENTER</b> end turn &nbsp; <b>Q E</b> rotate camera
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
