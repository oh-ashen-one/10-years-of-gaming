<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@tenyears/core — pipeline smoke demo</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #150a24;
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        user-select: none; -webkit-user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      #tag {
        position: fixed; left: 18px; bottom: 16px; z-index: 10;
        color: #fff3e0; font-style: italic; font-weight: 900;
        letter-spacing: 0.12em; font-size: 13px;
        background: rgba(21, 10, 36, 0.72);
        border: 3px solid #241433;
        box-shadow: 5px 5px 0 rgba(21, 10, 36, 0.55);
        transform: skewX(-6deg);
        padding: 8px 18px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="tag">@TENYEARS/CORE — PIPELINE SMOKE DEMO</div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
